<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pantalla de firma</title>
<link rel="stylesheet" href="/css/app.css">
<style>
  /* Nada en esta pantalla es un campo de texto: el teclado no aparece nunca. */
  html, body {
    height: 100%; overflow: hidden;
    user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  body { background: #0f172a; }

  .pantalla {
    position: fixed; inset: 0;
    display: none; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .pantalla.visible { display: flex; }

  /* ---------------------------------------------------------- reposo */
  #reposo {
    align-items: center; justify-content: center; text-align: center;
    color: #cbd5e1; gap: 22px;
  }
  #reposo .icono { font-size: 66px; }
  #reposo h2 { margin: 0; font-size: 30px; font-weight: 600; color: #f8fafc; }
  #reposo p { margin: 0; font-size: 17px; color: #94a3b8; max-width: 460px; line-height: 1.6; }
  /* Aviso en la propia pantalla de espera (nunca un dialogo: modo quiosco). */
  #reposo .aviso {
    max-width: 520px; padding: 14px 18px; border-radius: 12px;
    background: #7f1d1d; color: #fee2e2; font-size: 16px; line-height: 1.5;
  }
  .conexion {
    position: absolute; bottom: 22px; left: 0; right: 0;
    font-size: 13px; color: #64748b;
  }
  .conexion.caida { color: #f87171; }

  /* ---------------------------------------------------------- firma */
  #firma { background: var(--fondo); }

  .cabecera { padding: 14px 24px; color: #fff; display: flex; align-items: center; gap: 16px; flex: none; }
  .cabecera.entrega    { background: #15803d; }
  .cabecera.devolucion { background: #b45309; }
  .cabecera.cambio     { background: #6d28d9; }
  .cabecera .rotulo { font-size: 12px; letter-spacing: 1.6px; text-transform: uppercase; opacity: .85; }
  .cabecera .nombre { font-size: 23px; font-weight: 700; line-height: 1.2; }
  .cabecera .meta   { margin-left: auto; text-align: right; font-size: 13px; opacity: .9; line-height: 1.5; }

  .cuerpo { flex: 1; display: flex; min-height: 0; }

  .detalle {
    width: 33%; max-width: 380px; min-width: 250px;
    padding: 18px 22px; overflow-y: auto;
    background: #fff; border-right: 1px solid var(--linea);
  }
  .detalle h3 {
    margin: 0 0 12px; font-size: 11px; letter-spacing: 1px;
    text-transform: uppercase; color: var(--tenue);
  }
  .detalle ul { margin: 0 0 18px; padding: 0; list-style: none; }
  .detalle li {
    padding: 11px 0; border-bottom: 1px solid #eef2f7;
    font-size: 15px; line-height: 1.4;
  }
  .detalle li .cant { font-weight: 700; color: var(--azul); margin-right: 6px; }
  .detalle li .est  { display: block; font-size: 12px; color: var(--tenue); margin-top: 3px; }
  /* La nota de la recepcion detallada. En cursiva para que no compita con la
     condicion: el empleado tiene que poder distinguir de un vistazo el dato del
     almacen de la advertencia que le estan haciendo. */
  .detalle li .nota { display: block; font-size: 12px; font-style: italic; color: var(--tenue); margin-top: 2px; }
  /* En un CAMBIO van dos listas seguidas; el rotulo de cada una lleva el color de
     la cabecera para que "Devuelve" y "Recibe" no se lean como una sola lista. */
  .detalle h3.sentido { color: #6d28d9; }
  .declaracion { font-size: 12.5px; line-height: 1.6; color: var(--tinta-2); font-style: italic; }

  .panel { flex: 1; display: flex; flex-direction: column; padding: 18px 24px 22px; min-width: 0; }
  .paso { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; flex: none; }
  .paso .num {
    width: 26px; height: 26px; flex: none; border-radius: 50%;
    background: var(--azul); color: #fff;
    font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    align-self: center;
  }
  .paso h2 { margin: 0; font-size: 19px; font-weight: 700; }
  .paso .quien { font-size: 14px; color: var(--tenue); }

  .marco {
    flex: 1; position: relative; min-height: 0;
    background: #fff; border: 2px dashed var(--linea); border-radius: 14px;
    overflow: hidden;
  }
  .marco.tocado { border-style: solid; border-color: var(--azul); }
  #lienzo { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .guia {
    position: absolute; left: 8%; right: 8%; bottom: 26%;
    border-bottom: 1px solid var(--linea);
    pointer-events: none;
  }
  .pista {
    position: absolute; left: 0; right: 0; bottom: 14%;
    text-align: center; font-size: 15px; color: #94a3b8;
    pointer-events: none; transition: opacity .2s;
  }
  .marco.tocado .pista, .marco.tocado .guia { opacity: 0; }

  .error-firma {
    margin-top: 14px; padding: 12px 16px; flex: none;
    background: #fee2e2; border: 1px solid #fecaca; border-radius: 10px;
    color: #991b1b; font-size: 15px; font-weight: 600;
  }

  .acciones { display: flex; gap: 14px; margin-top: 16px; flex: none; }
  .acciones .boton { flex: 1; padding: 18px; font-size: 18px; border-radius: 12px; }
  .acciones .boton.confirmar { flex: 2; background: var(--verde); }

  /* ---------------------------------------------------------- listo */
  #listo {
    align-items: center; justify-content: center; text-align: center;
    background: var(--verde); color: #fff; gap: 18px;
  }
  #listo .marca { font-size: 84px; line-height: 1; }
  #listo h2 { margin: 0; font-size: 34px; }
  #listo p { margin: 0; font-size: 17px; opacity: .9; }

  @media (max-width: 820px) {
    .detalle { display: none; }
    .cabecera .nombre { font-size: 19px; }
  }
  /* En vertical, un CAMBIO no puede esconder el detalle: el empleado firma que
     devuelve unas herramientas y se lleva otras, y tiene que ver cuales. Se apila
     encima del lienzo (que se reajusta solo por ResizeObserver). Solo para CAMBIO:
     recepcion y devolucion siguen como estaban. */
  @media (max-width: 820px) and (orientation: portrait) {
    #cabecera.cambio ~ .cuerpo { flex-direction: column; }
    #cabecera.cambio ~ .cuerpo .detalle {
      display: block; width: auto; max-width: none; min-width: 0; max-height: 32vh;
      border-right: 0; border-bottom: 1px solid var(--linea);
    }
  }
</style>
</head>
<body>

<!-- ============================================================ REPOSO -->
<section id="reposo" class="pantalla visible">
  <div class="icono">&#9997;</div>
  <h2>Pantalla de firma</h2>
  <div class="aviso oculto" id="avisoReposo"></div>
  <p>Esperando un movimiento de recepci&oacute;n, devoluci&oacute;n o cambio.<br>
     El almacenista debe enviarlo desde su equipo.</p>
  <div class="conexion" id="conexion">Conectado al servidor</div>
</section>

<!-- ============================================================= FIRMA -->
<section id="firma" class="pantalla">
  <header class="cabecera" id="cabecera">
    <div>
      <div class="rotulo" id="rotuloTipo">RECEPCI&Oacute;N DE HERRAMIENTAS</div>
      <div class="nombre" id="nombreEmpleado"></div>
    </div>
    <div class="meta">
      <div id="metaCodigo"></div>
      <div id="metaFecha"></div>
    </div>
  </header>

  <div class="cuerpo">
    <aside class="detalle">
      <div id="listaHerramientas"></div>
      <h3>Declaraci&oacute;n</h3>
      <p class="declaracion" id="textoDeclaracion"></p>
    </aside>

    <div class="panel">
      <div class="paso">
        <span class="num" id="numPaso">1</span>
        <h2 id="tituloPaso">Firma del empleado</h2>
        <span class="quien" id="subtituloPaso"></span>
      </div>

      <div class="marco" id="marco">
        <canvas id="lienzo"></canvas>
        <div class="guia"></div>
        <div class="pista">Firme aqu&iacute; con el dedo o el l&aacute;piz</div>
      </div>

      <div class="error-firma oculto" id="errorFirma"></div>

      <div class="acciones">
        <button class="boton secundario" id="btnLimpiar">Borrar</button>
        <button class="boton confirmar" id="btnConfirmar" disabled>Confirmar firma</button>
      </div>
    </div>
  </div>
</section>

<!-- ============================================================= LISTO -->
<section id="listo" class="pantalla">
  <div class="marca">&#10003;</div>
  <h2>Firma registrada</h2>
  <p id="textoListo"></p>
</section>

<script src="/js/firma-canvas.js"></script>
<script src="/js/flujo.js"></script>
<script>
const $ = (s) => document.querySelector(s);

let movimiento = null;
let lienzo = null;
let paso = 1;                 // 1 = empleado, 2 = almacenista
let firmaEmpleado = null;

// ---------------------------------------------------------------- lienzo
lienzo = LienzoFirma($('#lienzo'), {
  alMarcar(hayTrazo) {
    $('#btnConfirmar').disabled = !hayTrazo;
    $('#marco').classList.toggle('tocado', hayTrazo);
  },
});

function reiniciarLienzo() {
  lienzo.limpiar();
  lienzo.ajustar();
  $('#btnConfirmar').disabled = true;
  $('#marco').classList.remove('tocado');
}

$('#btnLimpiar').addEventListener('click', reiniciarLienzo);

// ---------------------------------------------------------------- pantallas
function mostrar(id) {
  document.querySelectorAll('.pantalla').forEach((p) => p.classList.remove('visible'));
  $('#' + id).classList.add('visible');
}

let temporizadorError = null;
function mostrarError(texto) {
  const caja = $('#errorFirma');
  caja.textContent = texto;
  caja.classList.remove('oculto');
  clearTimeout(temporizadorError);
  temporizadorError = setTimeout(() => caja.classList.add('oculto'), 9000);
}

function escapar(t) {
  return String(t == null ? '' : t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function fechaLegible(iso) {
  const d = iso ? new Date(iso) : new Date();
  const p = (n) => String(n).padStart(2, '0');
  return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + '  ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

// Una lista de solo lectura: cada herramienta con su estado y, si la hay, su nota.
function listaHtml(herramientas) {
  return '<ul>' + herramientas
    .map((h) => {
      const est = h.estado ? '<span class="est">Estado: ' + escapar(h.estado) + '</span>' : '';
      // La nota solo la trae la recepcion detallada; en la rapida no hay donde ponerla.
      const nota = h.observaciones ? '<span class="nota">' + escapar(h.observaciones) + '</span>' : '';
      return '<li><span class="cant">' + escapar(h.cantidad || 1) + '&times;</span>' +
        escapar(h.descripcion) + est + nota + '</li>';
    })
    .join('') + '</ul>';
}

function pintarMovimiento(mov) {
  const esEntrega = mov.tipo === 'ENTREGA';
  const esCambio = mov.tipo === 'CAMBIO';
  const sufijo = mov.entregaCodigo ? ' — ' + mov.entregaCodigo : '';
  $('#cabecera').className = 'cabecera ' + (esEntrega ? 'entrega' : esCambio ? 'cambio' : 'devolucion');
  $('#rotuloTipo').textContent = esEntrega
    ? 'RECEPCIÓN DE HERRAMIENTAS'
    : esCambio
      ? 'CAMBIO DE HERRAMIENTA' + sufijo
      : 'DEVOLUCIÓN DE HERRAMIENTAS' + sufijo;
  $('#nombreEmpleado').textContent = mov.empleado;
  $('#metaCodigo').textContent = mov.codigo;
  // En una devolucion importa ver que entrega se esta cerrando. Un cambio no la
  // cierra (el empleado se lleva otra herramienta), solo cuelga de ella.
  $('#metaFecha').textContent = mov.entregaCodigo
    ? (esCambio ? 'Sobre ' : 'Cierra ') + mov.entregaCodigo
    : fechaLegible(mov.creado_en);

  // En un CAMBIO cada linea dice su `sentido`: lo que regresa al almacen y lo que se
  // lleva en su lugar van en dos listas, para que el empleado vea las dos mitades.
  if (esCambio) {
    const devuelve = mov.herramientas.filter((h) => h.sentido === 'devuelve');
    const recibe = mov.herramientas.filter((h) => h.sentido === 'recibe');
    $('#listaHerramientas').innerHTML =
      '<h3 class="sentido">Devuelve</h3>' + listaHtml(devuelve) +
      '<h3 class="sentido">Recibe</h3>' + listaHtml(recibe);
  } else {
    $('#listaHerramientas').innerHTML = '<h3>Herramientas</h3>' + listaHtml(mov.herramientas);
  }

  // El texto llega ya resuelto del servidor: la entrega detallada deja cambiarlo y
  // la tablet no puede tener una copia propia que lo contradiga.
  $('#textoDeclaracion').textContent = mov.declaracion || '';

  // Mostrar antes de preparar el lienzo: oculto mide 0 y no se puede escalar bien.
  ocultarAvisoReposo();
  mostrar('firma');
  irAPaso(1);
}

const PAPELES = {
  ENTREGA:    { empleado: 'quien recibe',            almacenista: 'quien entrega' },
  DEVOLUCION: { empleado: 'quien devuelve',          almacenista: 'quien recibe' },
  CAMBIO:     { empleado: 'quien devuelve y recibe', almacenista: 'quien recibe y entrega' },
};

function irAPaso(n) {
  paso = n;
  // Aqui no se nombra el movimiento sino lo que hace cada firmante (ver CLAUDE.md).
  const papeles = PAPELES[movimiento.tipo] || PAPELES.DEVOLUCION;
  $('#numPaso').textContent = n;
  if (n === 1) {
    $('#tituloPaso').textContent = 'Firma del empleado';
    $('#subtituloPaso').textContent = movimiento.empleado + ' — ' + papeles.empleado;
  } else {
    $('#tituloPaso').textContent = 'Firma del almacenista';
    $('#subtituloPaso').textContent = (movimiento.responsable || 'Responsable de almacén') + ' — ' + papeles.almacenista;
  }
  reiniciarLienzo();
}

// ---------------------------------------------------------------- confirmar
$('#btnConfirmar').addEventListener('click', async () => {
  const png = lienzo.aPng();
  if (!png) return;

  if (paso === 1) {
    firmaEmpleado = png;
    irAPaso(2);
    return;
  }

  $('#btnConfirmar').disabled = true;
  const enCurso = movimiento;
  try {
    const r = await fetch('/api/movimientos/' + enCurso.id + '/firmar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ firmaEmpleado: firmaEmpleado, firmaResponsable: png }),
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      // El almacenista cancelo el movimiento o envio otro mientras se firmaba (por el
      // tunel la tablet se entera con segundos de retraso). Reintentar no sirve: se
      // avisa en la pantalla de espera y se vuelve a ella.
      if (r.status === 400 && e.error === MOVIMIENTO_INACTIVO) {
        movimientoYaNoActivo(enCurso);
        return;
      }
      throw new Error(e.error || 'Error al guardar');
    }
    // `enCurso` y no `movimiento`: el aviso "tablet libre" del servidor suele llegar
    // antes que esta respuesta y ya lo dejo en null.
    // Si entre ese aviso y esta respuesta ya llego y se pinto otro movimiento, ese
    // manda: el acuse no lo tapa (misma guarda que en movimientoYaNoActivo).
    if (movimiento && movimiento.id !== enCurso.id) return;
    $('#textoListo').textContent = enCurso.codigo + ' — ' + enCurso.empleado;
    mostrar('listo');
    firmaEmpleado = null;
    movimiento = null;
    canal.olvidar();
    setTimeout(() => { if (!movimiento) mostrar('reposo'); }, 4000);
  } catch (err) {
    // Nada de alert(): en una tablet en modo quiosco bloquea la pantalla y obliga
    // a que alguien la desbloquee a mano. El trazo se conserva para reintentar.
    mostrarError('No se pudo guardar la firma: ' + err.message + '. Toque "Confirmar firma" para reintentar.');
    $('#btnConfirmar').disabled = false;
  }
});

// ---------------------------------------------------------------- ya no activo
// Texto exacto con el que responde el servidor (`firmar()` en src/db.js).
const MOVIMIENTO_INACTIVO = 'Este movimiento ya no está activo';

let temporizadorAviso = null;
function ocultarAvisoReposo() {
  clearTimeout(temporizadorAviso);
  $('#avisoReposo').classList.add('oculto');
}

function movimientoYaNoActivo(mov) {
  // Si mientras se esperaba la respuesta ya llego y se pinto otro movimiento, ese
  // manda: no se le borra la pantalla por el rechazo del anterior.
  if (movimiento && movimiento.id !== mov.id) return;
  const aviso = $('#avisoReposo');
  aviso.textContent = 'La firma no se guardó: el movimiento ' + mov.codigo +
    ' fue cancelado o reemplazado desde el almacén. Si hace falta, el almacenista debe enviarlo de nuevo.';
  aviso.classList.remove('oculto');
  clearTimeout(temporizadorAviso);
  temporizadorAviso = setTimeout(() => aviso.classList.add('oculto'), 15000);

  $('#errorFirma').classList.add('oculto');
  movimiento = null;
  firmaEmpleado = null;
  mostrar('reposo');
  // Si ya hay otro movimiento esperando, que aparezca sin aguardar al siguiente aviso.
  canal.olvidar();
  canal.consultar();
}

// ---------------------------------------------------------------- servidor
function recibir(mov) {
  // Si es el mismo movimiento que ya se esta firmando, solo se actualizan los datos.
  // Volver a pintarlo borraria el trazo en curso y la firma del paso 1: pasaria cada
  // vez que la tablet se despierta o se reconecta el flujo de eventos.
  if (mov && movimiento && mov.id === movimiento.id) {
    movimiento = mov;
    return;
  }
  movimiento = mov;
  firmaEmpleado = null;
  if (mov) {
    pintarMovimiento(mov);
    return;
  }
  // Al firmar, el servidor avisa enseguida que la tablet quedo libre. Si se obedeciera
  // de inmediato, el empleado no alcanzaria a ver el acuse: lo deja su propio temporizador.
  const visible = document.querySelector('.pantalla.visible');
  if (!visible || visible.id !== 'listo') mostrar('reposo');
}

// `let` y no `const`: los avisos de conexion pueden llegar antes de que
// termine la asignacion, y con `const` eso seria un error de zona muerta.
let canal = null;
canal = escucharMovimientos({
  alActivo: recibir,
  alConexion(bien) {
    const c = $('#conexion');
    if (bien) {
      c.textContent = canal && canal.porSondeo ? 'Conectado (modo consulta periódica)' : 'Conectado al servidor';
      c.classList.remove('caida');
    } else {
      c.textContent = 'Sin conexión con el servidor, reintentando…';
      c.classList.add('caida');
    }
  },
});

// Evita el zoom por doble toque, que en medio de una firma es molesto.
let ultimoToque = 0;
document.addEventListener('touchend', (e) => {
  const ahora = Date.now();
  if (ahora - ultimoToque < 320) e.preventDefault();
  ultimoToque = ahora;
}, { passive: false });
</script>
</body>
</html>
