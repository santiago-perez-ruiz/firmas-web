# Configuración de un túnel con nombre administrado desde Cloudflare.
# Las rutas, las políticas de Access y los límites públicos se definen en Cloudflare.
services:
  firmas:
    ports: !reset []
    environment:
      ACCESO_MODO: roles
      ACCESS_EMISOR: ${ACCESS_EMISOR:?Defina el emisor de Cloudflare Access}
      ACCESS_AUDIENCIA: ${ACCESS_AUDIENCIA:?Defina el AUD de la aplicación de Access}
      ACCESS_ADMINISTRADORES: ${ACCESS_ADMINISTRADORES:?Defina las cuentas administrativas}
      ACCESS_OPERADORES: ${ACCESS_OPERADORES:-}
      HOST_PANEL: ${HOST_PANEL:?Defina el hostname del panel}
      HOST_MOVIL: ${HOST_MOVIL:?Defina el hostname móvil}

  tunel:
    image: cloudflare/cloudflared:latest
    container_name: firmas-tunel
    restart: unless-stopped
    depends_on:
      - firmas
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Defina el token del túnel}
    command: tunnel --no-autoupdate run
